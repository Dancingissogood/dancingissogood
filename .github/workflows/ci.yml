name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dancingissogood_test
          POSTGRES_USER: dancingissogood
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dancingissogood -d dancingissogood_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only values. Tests mock Stripe and Clerk; no real credentials are used.
      DATABASE_URL: postgresql://dancingissogood:ci_only_password@localhost:5432/dancingissogood_test?schema=public
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:3000
      LANDING_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_++++++++++++++++++++++++++++++++
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      # The backend requires both Clerk keys together.
      CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Backend tests
        run: npm run test --workspace @dancingissogood/backend

      - name: Build site
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target runtime -t dancingissogood-backend:ci .
